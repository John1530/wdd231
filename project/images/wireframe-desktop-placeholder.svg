  <rect width="900" height="600" fill="#fff"/>
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="#000" stroke-width="3" stroke-dasharray="12 9"/>
  <text x="450" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700">ADD YOUR ORIGINAL DESKTOP WIREFRAME</text>
  <text x="450" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="20">Replace this SVG before submission</text>
